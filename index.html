<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>طلبات فريق وبنز</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Readex+Pro:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: phone-first ordering app — sticky header + category rail + photo grid, bottom sheets for cart/pay/track; staff board as a wide card grid */
:root{
  --bg:#f8f2ea; --surface:rgba(255,255,255,.52); --surface-2:rgba(255,255,255,.62); --surface-3:rgba(58,42,30,.07);
  --line:rgba(58,42,30,.12); --fg:#3a2a1e; --muted:#6f5a48; --dim:#8f7a68;
  --accent:#3a2a1e; --accent-2:#e08a2c; --on-accent:#fff8ef; --gold:#ffc23d; --gold-ink:#9a5f0c;
  --ok:#2f9e63; --warn:#a8690f; --bad:#cf4536; --info:#2f74b5;
  --glass-border:rgba(255,255,255,.85); --glass-shadow:0 18px 34px -20px rgba(120,80,40,.35),inset 0 1px 0 rgba(255,255,255,.7);
  --blur:blur(20px) saturate(160%);
  --display:"Lalezar","Readex Pro",system-ui,sans-serif;
  --body:"Readex Pro",system-ui,"Segoe UI",Tahoma,sans-serif;
  --r-sm:10px; --r:18px; --r-lg:26px;
  --shadow:0 26px 44px -22px rgba(120,80,40,.45),inset 0 1px 0 rgba(255,255,255,.7);
  color-scheme:light;
}
body[data-brand="buns"]{--gold:#ffc21a}
*{box-sizing:border-box}
html,body{height:100%}
html{direction:rtl}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
::selection{background:var(--accent);color:var(--on-accent)}
*{scrollbar-color:var(--surface-3) transparent;scrollbar-width:thin}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.ic{flex:none;display:block}
.num,.price,.ltr{font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1120px;margin-inline:auto}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:999px;font-weight:600;transition:transform .15s ease,background .2s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn-main{background:var(--accent);color:var(--on-accent);box-shadow:0 10px 24px -10px color-mix(in oklab,var(--accent) 70%,transparent)}
.btn-main:hover{background:color-mix(in oklab,var(--accent) 88%,white)}
.btn-main[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn-soft{background:var(--surface-3);color:var(--fg)}
.btn-soft:hover{background:color-mix(in oklab,var(--surface-3) 80%,white)}
.btn-ghost{color:var(--muted);min-height:40px;padding:0 12px}
.btn-ghost:hover{color:var(--fg)}
.btn-bad{background:color-mix(in oklab,var(--bad) 12%,white);color:var(--bad)}
.btn-ok{background:var(--ok);color:#fff}
.btn-block{width:100%}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--fg);position:relative}
.icon-btn:hover{background:var(--surface-3)}
.badge{position:absolute;top:-2px;left:-2px;min-width:20px;height:20px;border-radius:10px;background:var(--gold);color:var(--fg);font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 5px}

/* ---------- start view ---------- */
#v-start{min-height:100%;display:flex;flex-direction:column}
.start-top{padding-block:28px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.start-top .mark{font-family:var(--display);font-size:22px;color:var(--muted)}
.start-hero{padding-block:18px 26px}
.start-hero h1{font-size:clamp(44px,11vw,84px);letter-spacing:-.01em}
.start-hero h1 .w{display:inline-block}
.start-hero p{color:var(--muted);margin-top:10px;font-size:17px;max-width:40ch}
.brands{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px;padding-block:0 24px}
.brand-tile{position:relative;text-align:start;border-radius:var(--r-lg);overflow:hidden;background:var(--surface);display:grid;grid-template-rows:auto 1fr;min-height:340px;isolation:isolate;transition:box-shadow .3s}
.brand-tile:hover{box-shadow:var(--shadow)}
.brand-tile .art{height:220px;width:100%;aspect-ratio:auto;border-radius:0}
.brand-tile .bt-body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:6px}
.brand-tile .bt-en{font-family:var(--display);font-size:14px;letter-spacing:.12em;color:var(--gold-ink)}
.brand-tile h2{font-size:34px}
.brand-tile p{color:var(--muted)}
.brand-tile .go{margin-top:12px;align-self:flex-start;display:inline-flex;align-items:center;gap:8px;background:var(--tile-accent);color:#1a0d05;font-weight:700;border-radius:999px;padding:10px 18px}
.start-foot{margin-top:auto;padding-block:16px 28px;display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center;color:var(--dim);font-size:13px}

/* ---------- art tiles ---------- */
.art{position:relative;aspect-ratio:4/3;max-width:100%;border-radius:var(--r);overflow:hidden;
  background:radial-gradient(70% 70% at 50% 62%,color-mix(in oklab,var(--h,#ffb547) 55%,transparent),transparent 72%),
             radial-gradient(120% 90% at 50% 120%,color-mix(in oklab,var(--h,#ffb547) 30%,var(--surface-2)),var(--surface-2))}
.art svg{position:absolute;inset:6% 6% 2%;width:88%;height:92%}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.art::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 0%,rgba(255,255,255,.08),transparent 40%);pointer-events:none}

/* ---------- menu view ---------- */
.m-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(248,242,234,.5);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-bottom:1px solid rgba(255,255,255,.7)}
.m-head .row{display:flex;align-items:center;gap:10px;padding-block:10px}
.m-brand{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.1}
.m-brand b{font-family:var(--display);font-weight:400;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-brand small{color:var(--gold-ink);font-size:11px;letter-spacing:.14em;font-weight:600}
.branch-chip{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 14px;border-radius:999px;background:var(--surface-2);font-size:13px;font-weight:500;max-width:46vw}
.branch-chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cats{display:flex;gap:8px;overflow-x:auto;padding-block:2px 12px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;height:38px;padding:0 16px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-weight:500;font-size:14px;transition:background .2s,color .2s}
.cat[aria-current="true"]{background:var(--accent);color:var(--on-accent)}
.m-hero{padding-block:26px 10px;display:flex;flex-direction:column;gap:8px}
.m-banner{width:100%;max-width:100%;aspect-ratio:2.4/1;border-radius:var(--r-lg);overflow:hidden;margin-bottom:10px;background:var(--surface-2)}
.m-banner img{width:100%;height:100%;object-fit:cover;display:block}
@media (max-width:420px){.m-banner{aspect-ratio:16/10}}
.m-hero h1{font-size:clamp(38px,9vw,64px)}
.m-hero h1 .w{display:inline-block}
.m-hero p{color:var(--muted);max-width:52ch}
.m-sec{padding-block:22px 4px;scroll-margin-top:130px}
.m-sec h2{font-size:28px;margin-bottom:14px;display:flex;align-items:baseline;gap:10px}
.m-sec h2 small{font-family:var(--body);font-size:13px;color:var(--dim);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,168px),1fr));gap:14px}
@media (max-width:420px){.grid{grid-template-columns:1fr 1fr;gap:10px}}
.card{position:relative;display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r);overflow:hidden;text-align:start;transition:box-shadow .3s;will-change:transform}
.card:hover{box-shadow:var(--shadow)}
.card .art img{transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.card:hover .art img{transform:scale(1.05)}
.card .art{border-radius:0}
.art-btn{display:block;width:100%;padding:0;text-align:inherit}
.card.wide .art-btn{flex:0 0 52%;display:flex}
.card.wide .art-btn .art{flex:1}
.card .c-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;flex:1}
.card .c-name{font-weight:600;font-size:15px;line-height:1.35}
.card .c-desc{color:var(--dim);font-size:12.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .c-foot{margin-top:auto;padding-top:8px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.price{font-weight:700;font-size:15px}
.price small{font-weight:500;color:var(--muted);font-size:11px;margin-inline-start:3px}
.add{width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.add:active{transform:scale(.9)}
.stepper{display:inline-flex;align-items:center;gap:2px;background:var(--surface-3);border-radius:999px;padding:3px}
.stepper button{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--fg)}
.stepper button:hover{background:var(--surface-2)}
.stepper .n{min-width:22px;text-align:center;font-weight:700}
.stepper.lg button{width:44px;height:44px}
.stepper.lg .n{min-width:36px;font-size:18px}
.card.wide{grid-column:1/-1;flex-direction:row}
.card.wide .art{aspect-ratio:auto;min-height:200px}
@media (max-width:420px){.card.wide{flex-direction:column}.card.wide .art-btn{flex:none}.card.wide .art{aspect-ratio:16/10;min-height:0}}
.card.wide .c-body{padding:18px;justify-content:center}
.card.wide .c-name{font-family:var(--display);font-weight:400;font-size:26px}
.card.wide .c-desc{-webkit-line-clamp:3;font-size:14px}
.tag-hot{position:absolute;top:10px;right:10px;z-index:4;background:var(--gold);color:var(--fg);font-size:11px;font-weight:700;border-radius:999px;padding:3px 10px}
.card.soldout{opacity:.55}
.card.soldout .add{display:none}
.soldout-chip{font-size:12px;color:var(--muted);background:var(--surface-3);border-radius:999px;padding:4px 10px}
.m-end{height:120px}

/* cart bar */
.cartbar{position:fixed;inset:auto 0 0;z-index:30;padding:10px max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.cartbar button{pointer-events:auto;margin-inline:auto;max-width:560px;width:100%;display:flex;align-items:center;gap:12px;height:62px;border-radius:999px;background:rgba(58,42,30,.84);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:var(--on-accent);padding:0 10px 0 22px;font-weight:700;font-size:16px;box-shadow:0 20px 38px -16px rgba(58,42,30,.6)}
.cartbar .cnt{width:42px;height:42px;border-radius:50%;background:var(--gold);color:var(--fg);display:grid;place-items:center;font-size:16px}
.cartbar .lbl{flex:1;text-align:start}
.cartbar .tot{font-variant-numeric:tabular-nums}

/* ---------- sheet ---------- */
#sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(58,42,30,.22);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sheet{position:relative;width:100%;max-width:580px;max-height:92%;overflow:auto;overscroll-behavior:contain;background:rgba(253,249,243,.78);backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%);border:1px solid var(--glass-border);border-radius:28px 28px 0 0;padding:8px max(18px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));box-shadow:0 -20px 60px -24px rgba(120,80,40,.45)}
@media (min-width:700px){#sheet-wrap{align-items:center}.sheet{border-radius:28px;max-height:88%}}
.grab{width:44px;height:5px;border-radius:3px;background:var(--surface-3);margin:4px auto 10px}
.sh-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sh-head h2{flex:1;font-size:28px}
.sh-sec{display:flex;flex-direction:column;gap:10px;padding-block:14px;border-top:1px solid var(--line)}
.sh-sec:first-of-type{border-top:0}
.sh-sec h3{font-family:var(--body);font-weight:600;font-size:14px;color:var(--muted)}
.sh-foot{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom,0px));margin:6px -18px -20px;padding:14px 18px calc(18px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(253,249,243,0),rgba(253,249,243,.94) 30%);display:flex;flex-direction:column;gap:8px}
.item-art{margin:-2px 0 14px}
.item-art .art{border-radius:20px}
.line{display:flex;align-items:center;gap:12px;padding-block:8px}
.line .thumb{width:58px;flex:none}
.line .thumb .art{border-radius:12px}
.line .meta{flex:1;min-width:0}
.line .meta b{display:block;font-weight:600}
.line .meta small{color:var(--dim);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface-2);border-radius:16px;padding:5px}
.seg button{min-height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:rgba(255,255,255,.95);color:var(--fg);box-shadow:inset 0 0 0 2px var(--accent)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.input,select.input,textarea.input{width:100%;min-height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface-2);padding:12px 14px;outline:none;transition:border-color .2s}
textarea.input{min-height:76px;resize:vertical}
.input:focus{border-color:var(--accent)}
.input::placeholder{color:var(--dim)}
.input.bad{border-color:var(--bad)}
.err{color:var(--bad);font-size:13px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.row2{grid-template-columns:1fr}}
.sum{display:flex;justify-content:space-between;gap:10px;color:var(--muted)}
.sum.total{color:var(--fg);font-weight:700;font-size:18px}
.branches{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.branches button{min-height:54px;border-radius:14px;background:var(--surface-2);font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px}
.branches button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:700}

/* pay */
.paycard{background:var(--surface-2);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.paycard .kv{display:flex;align-items:center;gap:10px;justify-content:space-between}
.paycard .kv small{display:block;color:var(--dim);font-size:12px}
.paycard .kv b{font-weight:600}
.paycard .iban{font-size:clamp(15px,4.6vw,18px);letter-spacing:.04em;font-weight:600;white-space:nowrap;overflow-x:auto;text-align:left}
.kv-iban{display:flex;flex-direction:column;gap:6px}
.kv-iban .kv{align-items:flex-end}
.copy{flex:none;height:38px;padding:0 12px;border-radius:999px;background:var(--surface-3);display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.copy.done{background:var(--ok);color:#fff}
.amount-big{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.sample-note{font-size:12px;color:var(--warn);background:color-mix(in oklab,var(--warn) 12%,transparent);border-radius:10px;padding:6px 10px}
.drop{position:relative;display:flex;align-items:center;gap:14px;border:2px dashed var(--line);border-radius:18px;padding:16px;cursor:pointer;transition:border-color .2s,background .2s}
.drop:hover,.drop.over{border-color:var(--accent);background:color-mix(in oklab,var(--accent) 6%,transparent)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop .dz-ic{width:52px;height:52px;border-radius:14px;background:var(--surface-3);display:grid;place-items:center;flex:none;color:var(--accent)}
.drop img{width:52px;height:52px;object-fit:cover;border-radius:12px;flex:none}
.drop b{display:block}
.drop small{color:var(--dim)}
.hint{color:var(--dim);font-size:13px}

/* track */
.track-id{font-family:var(--display);font-size:46px;line-height:1;direction:ltr;text-align:right}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:12px;position:relative;padding-bottom:18px}
.steps li:last-child{padding-bottom:0}
.steps li::before{content:"";position:absolute;right:16px;top:30px;bottom:-2px;width:2px;background:var(--line)}
.steps li:last-child::before{display:none}
.steps .dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--dim);z-index:1}
.steps li.done .dot{background:var(--ok);color:#fff}
.steps li.done::before{background:var(--ok)}
.steps li.now .dot{background:var(--accent);color:var(--on-accent);box-shadow:0 0 0 6px color-mix(in oklab,var(--accent) 22%,transparent)}
.steps b{display:block;padding-top:5px}
.steps small{color:var(--dim)}
.steps li:not(.done):not(.now) b{color:var(--dim);font-weight:500}
.alert{border-radius:16px;padding:14px;background:color-mix(in oklab,var(--bad) 10%,white);color:#7a2118;display:flex;flex-direction:column;gap:8px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.st-review{background:color-mix(in oklab,var(--warn) 20%,transparent);color:var(--warn)}
.st-confirmed{background:color-mix(in oklab,var(--info) 18%,transparent);color:var(--info)}
.st-preparing{background:color-mix(in oklab,var(--accent-2) 18%,transparent);color:#9a4d0a}
.st-ready{background:color-mix(in oklab,var(--ok) 20%,transparent);color:var(--ok)}
.st-done{background:var(--surface-3);color:var(--muted)}
.st-rejected{background:color-mix(in oklab,var(--bad) 20%,transparent);color:var(--bad)}
.chip-brand{background:var(--surface-3);color:var(--fg)}
.chip-sample{background:transparent;border:1px dashed var(--dim);color:var(--dim)}

/* ---------- board ---------- */
.b-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(248,242,234,.5);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-bottom:1px solid rgba(255,255,255,.7)}
.b-head .row{display:flex;align-items:center;gap:10px;padding-block:12px;flex-wrap:wrap}
.b-head h1{font-size:30px;flex:1;min-width:140px}
.b-head select{width:auto;min-height:44px;border-radius:999px;padding:0 14px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:0 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;height:40px;padding:0 14px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-weight:500;display:inline-flex;align-items:center;gap:8px}
.tab .n{min-width:22px;height:22px;border-radius:11px;background:var(--surface-3);display:grid;place-items:center;font-size:12px;padding:0 6px;font-variant-numeric:tabular-nums}
.tab[aria-current="true"]{background:var(--fg);color:var(--bg)}
.tab[aria-current="true"] .n{background:var(--gold);color:var(--fg)}
.orders{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px;padding-block:18px 60px;align-items:start}
.ocard{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.ocard.fresh{box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.o-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.o-id{font-family:var(--display);font-size:26px;direction:ltr;margin-inline-end:auto}
.o-who{display:flex;flex-direction:column;gap:2px}
.o-who b{font-weight:600}
.o-who span{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:6px}
.o-items{list-style:none;margin:0;padding:10px 12px;background:var(--surface-2);border-radius:12px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.o-items li{display:flex;gap:8px}
.o-items .q{font-weight:700;color:var(--accent);min-width:24px;font-variant-numeric:tabular-nums}
.o-items .nt{display:block;color:var(--dim);font-size:12px}
.o-pay{display:flex;align-items:center;gap:12px}
.o-pay .rc{width:64px;height:64px;border-radius:12px;overflow:hidden;flex:none;background:var(--surface-2);position:relative}
.o-pay .rc img{width:100%;height:100%;object-fit:cover}
.o-pay .rc span{position:absolute;inset:auto 0 0;font-size:10px;text-align:center;background:rgba(0,0,0,.6);color:#fff;padding:2px}
.o-pay .amt{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.o-pay small{display:block;color:var(--dim)}
.o-acts{display:flex;gap:8px;flex-wrap:wrap}
.o-acts .btn{flex:1;min-height:46px}
.reasons{display:flex;flex-wrap:wrap;gap:6px}
.reasons button{height:34px;padding:0 12px;border-radius:999px;background:var(--surface-2);font-size:13px}
.reasons button[aria-pressed="true"]{background:var(--bad);color:#fff}
.empty{grid-column:1/-1;text-align:center;padding:60px 16px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty svg{color:var(--dim)}
.gate{min-height:100%;display:grid;place-items:center;padding-block:40px}
.gate-box{width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px;text-align:center}
.gate-box h1{font-size:40px}
.pin{font-size:28px;text-align:center;letter-spacing:.5em;direction:ltr}

/* settings menu editor */
.ed-row{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding-block:8px;border-top:1px solid var(--line)}
.ed-row .art{border-radius:10px}
.ed-row .nm{font-weight:600;font-size:14px}
.ed-row .ctrls{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
.ed-row input.input{min-height:38px;padding:6px 10px;width:100px;border-radius:10px}
.mini{height:38px;padding:0 10px;border-radius:10px;background:var(--surface-3);font-size:12.5px;display:inline-flex;align-items:center;gap:5px;position:relative;overflow:hidden}
.mini input{position:absolute;inset:0;opacity:0;cursor:pointer}
.switch{position:relative;width:48px;height:28px;border-radius:14px;background:var(--surface-3);flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(58,42,30,.25);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"]::after{transform:translateX(-20px)}

/* viewer + toast + fly */
#viewer{position:fixed;inset:0;z-index:60;background:rgba(58,42,30,.55);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:grid;place-items:center;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px))}
#viewer img{max-width:100%;max-height:100%;border-radius:14px}
#viewer .icon-btn{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:max(14px,env(safe-area-inset-left,0px))}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);z-index:70;background:var(--fg);color:var(--bg);font-weight:600;border-radius:999px;padding:12px 20px;opacity:0;pointer-events:none;transition:opacity .25s,transform .35s cubic-bezier(.2,.8,.2,1);max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.fly{position:fixed;z-index:80;width:22px;height:22px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 5px rgba(255,255,255,.7);pointer-events:none}
/* ---------- glass system ---------- */
.card,.brand-tile,.ocard,.paycard,.icon-btn,.branch-chip,.cat,.tab,.seg,.branches button,.input,.o-items,.reasons button,.copy,.stepper,.soldout-chip,.chip-brand,.mini{
  background:var(--surface);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-border)}
.card,.brand-tile,.ocard,.paycard{box-shadow:var(--glass-shadow)}
.card .art,.brand-tile .art{margin:6px 6px 0;border-radius:calc(var(--r) - 4px);width:auto}
.brand-tile .art{border-radius:calc(var(--r-lg) - 6px)}
.card.wide .art-btn .art{margin:6px}
@media (max-width:420px){.card.wide .art-btn .art{margin:6px 6px 0}}
.cat[aria-current="true"],.branches button[aria-pressed="true"],.tab[aria-current="true"]{border-color:transparent}
.input{border:1.5px solid var(--glass-border)}
.input:focus{border-color:var(--accent);background:rgba(255,255,255,.85)}
.input.bad{border-color:var(--bad)}
.icon-btn:hover,.branch-chip:hover,.cat:hover{background:rgba(255,255,255,.8)}
.cat[aria-current="true"]:hover{background:var(--accent)}
.bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(70px);animation:drift 26s ease-in-out infinite alternate}
.blob.b1{width:55vmax;height:55vmax;background:#ffd3a8;top:-18vmax;right:-14vmax;opacity:.85}
.blob.b2{width:48vmax;height:48vmax;background:#fff0a0;top:35vh;left:-18vmax;opacity:.8;animation-duration:31s;animation-delay:-8s}
.blob.b3{width:44vmax;height:44vmax;background:#cfe9d4;bottom:-16vmax;right:-6vmax;opacity:.8;animation-duration:36s;animation-delay:-15s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(4vmax,7vmax) scale(1.12)}100%{transform:translate(-5vmax,3vmax) scale(.94)}}
.card::after,.brand-tile::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .4s;border-radius:inherit;
  background:radial-gradient(220px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.6),transparent 62%)}
.card:hover::after,.brand-tile:hover::after,.card.touch::after,.brand-tile.touch::after{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function compress(file,maxW,q){
 return new Promise((res,rej)=>{
  if(!file||!file.type.startsWith('image/'))return rej(new Error('type'));
  const fr=new FileReader();fr.onerror=()=>rej(fr.error);
  fr.onload=()=>{const img=new Image();img.onerror=()=>rej(new Error('img'));img.onload=()=>{
   const sc=Math.min(1,maxW/img.width),c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
   c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};img.src=fr.result};
  fr.readAsDataURL(file);
 });
}

  el.innerHTML=`<div class="wrap gate"><form class="gate-box" id="gate">${ic('lock',36)}<h1>لوحة الفرع</h1><p style="color:var(--muted)">أدخل رمز الموظفين لعرض الطلبات وتأكيد التحويلات.</p>
   <input class="input pin num" id="pin" inputmode="numeric" maxlength="6" autocomplete="off" aria-label="رمز الدخول" placeholder="••••">
   <span class="err" id="pin-err" hidden>الرمز غير صحيح.</span>
   <button class="btn btn-main btn-block" type="submit">دخول</button>
   <span class="hint">الرمز التجريبي 1234 · غيّره من الإعدادات</span>
   <a class="btn-ghost" href="#" style="display:inline-flex;align-items:center;justify-content:center;gap:6px">${ic('back',16)}رجوع لصفحة الطلب</a></form></div>`;
  setTimeout(()=>{const p=$('#pin');if(p)p.focus()},50);return;
 }
 const vis=store.orders.filter(o=>bBranch==='all'||o.branch===bBranch);
 const counts={};['review','confirmed','preparing','ready','done','rejected'].forEach(s=>counts[s]=vis.filter(o=>o.status===s).length);
 const list=vis.filter(o=>o.status===bTab).sort((a,b)=>bTab==='done'||bTab==='rejected'?b.at-a.at:a.at-b.at);
 const tabs=[['review','بانتظار التحقق'],['confirmed','مؤكدة'],['preparing','قيد التحضير'],['ready','جاهزة'],['done','مكتملة'],['rejected','مرفوضة']];
 el.innerHTML=`<header class="b-head"><div class="wrap"><div class="row">
   <a class="icon-btn" href="#" aria-label="رجوع">${ic('back')}</a><h1>لوحة الطلبات</h1>
   <select class="input" id="b-branch" aria-label="الفرع"><option value="all">كل الفروع</option>${BRANCHES.map(([id,n])=>`<option value="${id}" ${bBranch===id?'selected':''}>${n}</option>`).join('')}</select>
   <button class="icon-btn" data-act="settings" aria-label="الإعدادات">${ic('sliders')}</button></div>
   <nav class="tabs">${tabs.map(([s,n])=>`<button class="tab" data-act="btab" data-v="${s}" aria-current="${bTab===s}">${n}<span class="n">${counts[s]}</span></button>`).join('')}</nav></div></header>
  <div class="wrap orders">${list.length?list.map(oCard).join(''):`<div class="empty">${ic('receipt',44)}<b>لا توجد طلبات هنا</b><span>${bTab==='review'?'أي طلب جديد يوصل بيظهر هنا مع إيصال التحويل.':'الطلبات تنتقل لهذا القسم حسب حالتها.'}</span></div>`}</div>`;
 const g=G();$$('.ocard.fresh').forEach(c=>{if(g)g.from(c,{y:-20,opacity:0,duration:.6,ease:'expo.out'})});fresh.clear();
}
function oCard(o){
 const B=BRANDS[o.brand];
 const next={review:['confirmed','تأكيد الدفع'],confirmed:['preparing','بدء التحضير'],preparing:['ready',o.type==='delivery'?'خرج للتوصيل':'جاهز للاستلام'],ready:['done','تم التسليم']}[o.status];
 const rej=rejecting===o.id;
 return `<article class="ocard${fresh.has(o.id)?' fresh':''}">
  <div class="o-top"><span class="o-id">${o.id}</span><span class="chip chip-brand">${B.ar}</span>${o.sample?'<span class="chip chip-sample">مثال</span>':''}</div>
  <div class="o-who"><b>${esc(o.name)}</b><span class="ltr" style="justify-content:flex-end;user-select:all">+973 ${esc(o.phone)}</span>
   <span>${ic(o.type==='delivery'?'bike':'store',15)}${o.type==='delivery'?'توصيل · '+esc(o.address):'استلام · فرع '+branchName(o.branch)}</span>
   <span>${ic('clock',15)}${clock(o.at)} · ${timeAgo(o.at)}</span></div>
  <ul class="o-items">${o.items.map(l=>{const m=byId(l.id);return `<li><span class="q">${l.qty}×</span><span>${esc(m.name)}${l.note?`<span class="nt">${esc(l.note)}</span>`:''}</span></li>`}).join('')}</ul>
  <div class="o-pay">${o.receipt?`<button class="rc" data-act="view-rc" data-id="${o.id}" aria-label="عرض الإيصال"><img src="${o.receipt}" alt=""><span>الإيصال</span></button>`:`<span class="rc" style="display:grid;place-items:center;color:var(--dim)">${ic('image')}</span>`}
   <div><span class="amt">${bhd(o.total)} د.ب</span><small>${o.pay==='iban'?'تحويل آيبان':'BenefitPay'} · المرجع ${o.id}</small></div></div>
  ${o.status==='rejected'&&o.reason?`<div class="alert" style="padding:10px 12px;font-size:13px">${esc(o.reason)}</div>`:''}
  ${rej?`<div class="field"><label>سبب الرفض (يظهر للزبون)</label><div class="reasons">${['المبلغ غير مطابق','الإيصال غير واضح','لم يصل التحويل بعد'].map(r=>`<button data-act="rr" data-v="${r}" aria-pressed="${rejReason===r}">${r}</button>`).join('')}</div>
    <div class="o-acts"><button class="btn btn-bad" data-act="rej-ok" data-id="${o.id}" ${rejReason?'':'disabled'}>تأكيد الرفض</button><button class="btn btn-soft" data-act="rej-cancel">إلغاء</button></div></div>`
  :next?`<div class="o-acts"><button class="btn ${o.status==='review'?'btn-ok':'btn-main'}" data-act="adv" data-id="${o.id}" data-v="${next[0]}">${ic('check',18)}${next[1]}</button>${o.status==='review'?`<button class="btn btn-bad" data-act="rej" data-id="${o.id}">رفض</button>`:''}</div>`:''}
 </article>`;
}
function beep(){try{const A=window.AudioContext||window.webkitAudioContext;const c=new A();[0,.18].forEach((t,i)=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=i?1180:880;g.gain.setValueAtTime(.0001,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.25,c.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+t+.16);o.connect(g).connect(c.destination);o.start(c.currentTime+t);o.stop(c.currentTime+t+.2)})}catch(e){}}
store.orders.forEach(o=>seen.add(o.id));

function sSettings(){
 const S=store.settings;
 const rows=MENU.filter(m=>m.b===edBrand).map(m=>{const e=store.menuEdits[m.id]||{};return `<div class="ed-row"><div>${artBox(m)}</div>
  <div><div class="nm">${esc(m.name)}</div><div class="ctrls"><input class="input num ltr" type="number" step="0.050" min="0" id="pr-${m.id}" data-price="${m.id}" value="${bhd(priceOf(m.id))}" aria-label="سعر ${esc(m.name)}">
   <span class="mini">${ic('image',15)}${e.photo?'تغيير الصورة':'رفع صورة'}<input type="file" accept="image/*" data-photo="${m.id}" aria-label="صورة ${esc(m.name)}"></span>
   ${e.photo?`<button class="mini" data-act="rm-photo" data-id="${m.id}">إزالة</button>`:''}</div></div>
  <button class="switch" role="switch" aria-checked="${isAvail(m.id)}" data-act="avail" data-id="${m.id}" aria-label="${esc(m.name)} متوفر"></button></div>`}).join('');
 return head('الإعدادات')+`
  <div class="sh-sec"><h3>بيانات الدفع التي تظهر للزبون</h3>
   <div class="field"><label for="s-holder">اسم المستفيد</label><input class="input" id="s-holder" value="${esc(S.holder)}"></div>
   <div class="field"><label for="s-bank">البنك</label><input class="input" id="s-bank" value="${esc(S.bank)}"></div>
   <div class="field"><label for="s-iban">رقم الآيبان</label><input class="input ltr" id="s-iban" value="${esc(fmtIban(S.iban))}" style="text-align:left"><span class="err" id="iban-err" hidden>الآيبان البحريني 22 خانة ويبدأ بـ BH.</span></div>
   <div class="row2"><div class="field"><label for="s-benefit">رقم BenefitPay</label><input class="input ltr num" id="s-benefit" inputmode="tel" value="${esc(S.benefit)}" style="text-align:right"></div>
   <div class="field"><label for="s-fee">رسوم التوصيل (د.ب)</label><input class="input ltr num" id="s-fee" type="number" step="0.100" min="0" value="${bhd(S.fee)}" style="text-align:right"></div></div>
   <div class="field"><label for="s-pin">رمز دخول اللوحة</label><input class="input ltr num" id="s-pin" inputmode="numeric" maxlength="6" value="${esc(S.pin)}" style="text-align:right"></div>
   <button class="btn btn-main" data-act="save-settings">حفظ بيانات الدفع</button></div>
  <div class="sh-sec"><h3>القائمة: الأسعار والصور والتوفر</h3>
   <div class="seg"><button data-act="ed-brand" data-v="fareeq" aria-pressed="${edBrand==='fareeq'}">فريق بن عاقول</button><button data-act="ed-brand" data-v="buns" aria-pressed="${edBrand==='buns'}">جست بنز</button></div>
   <div>${rows}</div></div>
  <div class="sh-sec"><h3>الطلبات التجريبية</h3><button class="btn btn-soft" data-act="clear-samples">حذف طلبات المثال</button></div>`;
}

/* ---------------- events ---------------- */
document.addEventListener('click',async e=>{
 const t=e.target.closest('[data-act]');if(!t)return;
 const a=t.dataset.act,id=t.dataset.id,v=t.dataset.v;
 switch(a){
  case 'close-sheet':closeSheet();break;
  case 'mine':openSheet('mine');break;
  case 'track':if(!brand)brand=store.orders.find(o=>o.id===id).brand;openSheet('track',id);break;
  case 'branch':openSheet('branch');break;
  case 'set-branch':store.profile.branch=v;save();closeSheet();renderMenu();toast('فرع '+branchName(v));break;
  case 'cat':{const s=$('#sec-'+t.dataset.cat);if(s)s.scrollIntoView({behavior:RM?'auto':'smooth',block:'start'});break}
  case 'item':itemQty=1;openSheet('item',id);break;
  case 'add':addToCart(id,1,'',t);break;
  case 'inc':if(id==='__item'){itemQty=Math.min(20,itemQty+1);renderSheet()}else changeQty(id,1);break;
  case 'dec':if(id==='__item'){itemQty=Math.max(1,itemQty-1);renderSheet()}else changeQty(id,-1);break;
  case 'item-add':{const note=($('#item-note')||{}).value||'';closeSheet();setTimeout(()=>addToCart(id,itemQty,note.trim(),$(`.card[data-id="${id}"] .art`)),RM?0:330);break}
  case 'cart':checkout.errors={};openSheet('cart');break;
  case 'linc':case 'ldec':{readCartForm();const c=cart(),l=c[+t.dataset.i];l.qty+=a==='linc'?1:-1;if(l.qty<=0)c.splice(+t.dataset.i,1);save();renderSheet();refreshCard(l.id);renderCartBar();break}
  case 'otype':readCartForm();checkout.type=v;renderSheet();break;
  case 'pick-branch':readCartForm();store.profile.branch=v;save();renderSheet();{const bc=$('.branch-chip span');if(bc)bc.textContent=branchName(v)}break;
  case 'to-pay':readCartForm();if(validateCart())openSheet('pay');else{renderSheet();const er=$('.sheet .err');if(er)er.scrollIntoView({block:'center',behavior:RM?'auto':'smooth'})}break;
  case 'paym':checkout.pay=v;renderSheet();break;
  case 'copy':copy(v,t);break;
  case 'submit':submitOrder();break;
  case 'btab':bTab=v;rejecting=null;renderBoard();break;
  case 'adv':{const o=store.orders.find(x=>x.id===id);o.status=v;o.reason='';save();renderBoard();toast(`${o.id}: ${STATUS[v]}`);break}
  case 'rej':rejecting=id;rejReason='';renderBoard();break;
  case 'rr':rejReason=v;renderBoard();break;
  case 'rej-cancel':rejecting=null;renderBoard();break;
  case 'rej-ok':{const o=store.orders.find(x=>x.id===id);o.status='rejected';o.reason=rejReason;rejecting=null;save();renderBoard();toast(`رُفض ${o.id} وتم إبلاغ الزبون`);break}
  case 'view-rc':{const o=store.orders.find(x=>x.id===id);const vw=$('#viewer');$('img',vw).src=o.receipt;vw.hidden=false;break}
  case 'close-viewer':$('#viewer').hidden=true;break;
  case 'settings':openSheet('settings');break;
  case 'ed-brand':edBrand=v;renderSheet();break;
  case 'avail':{const ed=store.menuEdits[id]=store.menuEdits[id]||{};ed.off=!ed.off;save();renderSheet();break}
  case 'rm-photo':{delete (store.menuEdits[id]||{}).photo;save();renderSheet();break}
  case 'save-settings':{
   const iban=$('#s-iban').value.replace(/\s+/g,'').toUpperCase();
   if(!/^BH\d{2}[A-Z]{4}[A-Z0-9]{14}$/.test(iban)){$('#iban-err').hidden=false;$('#s-iban').classList.add('bad');break}
   const S=store.settings;S.holder=$('#s-holder').value.trim()||S.holder;S.bank=$('#s-bank').value.trim()||S.bank;S.iban=iban;
   S.benefit=$('#s-benefit').value.replace(/[^\d]/g,'')||S.benefit;S.fee=Math.max(0,parseFloat($('#s-fee').value)||0);
   const pin=$('#s-pin').value.replace(/[^\d]/g,'');if(pin.length>=4)S.pin=pin;S.sample=false;save();toast('تم حفظ بيانات الدفع');renderSheet();break}
  case 'clear-samples':store.orders=store.orders.filter(o=>!o.sample);save();renderBoard();toast('تم حذف طلبات المثال');break;
 }
});
document.addEventListener('change',async e=>{
 const t=e.target;
 if(t.id==='b-branch'){bBranch=t.value;renderBoard();return}
 if(t.id==='rc-file'&&t.files[0]){try{checkout.receipt=await compress(t.files[0],1100,.72);renderSheet();toast('تم إرفاق الإيصال')}catch(err){toast('اختر صورة (JPG أو PNG) للإيصال')}return}
 if(t.dataset.reupload&&t.files[0]){try{const o=store.orders.find(x=>x.id===t.dataset.reupload);o.receipt=await compress(t.files[0],1100,.72);o.status='review';o.reason='';save();renderSheet();toast('وصلنا الإيصال الجديد')}catch(err){toast('اختر صورة للإيصال')}return}
 if(t.dataset.photo&&t.files[0]){try{const ed=store.menuEdits[t.dataset.photo]=store.menuEdits[t.dataset.photo]||{};ed.photo=await compress(t.files[0],720,.8);if(!save()){delete ed.photo;toast('الصورة كبيرة على مساحة التخزين')}renderSheet()}catch(err){toast('اختر ملف صورة')}return}
 if(t.dataset.price){const n=parseFloat(t.value);if(n>=0){const ed=store.menuEdits[t.dataset.price]=store.menuEdits[t.dataset.price]||{};ed.price=Math.round(n*1000)/1000;save();toast('تم تحديث السعر')}return}
});
document.addEventListener('submit',e=>{
 if(e.target.id!=='gate')return;e.preventDefault();
 if($('#pin').value.trim()===store.settings.pin){unlocked=true;try{sessionStorage.setItem('fbq-board','1')}catch(_){}renderBoard()}
 else{$('#pin-err').hidden=false;const g=G();if(g)g.fromTo('#pin',{x:-10},{x:0,duration:.5,ease:'elastic.out(1,.3)'})}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#viewer').hidden)$('#viewer').hidden=true;else closeSheet()}});
['dragover','dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{const d=e.target.closest&&e.target.closest('.drop');if(!d)return;if(ev==='dragover'){d.classList.add('over')}else d.classList.remove('over')}));

/* live sync between customer tabs and the branch board */
addEventListener('storage',e=>{
 if(e.key!==KEY)return;store=loadStore();
 const newOnes=store.orders.filter(o=>!seen.has(o.id));newOnes.forEach(o=>{seen.add(o.id);fresh.add(o.id)});
 if(view==='board'&&unlocked){if(newOnes.length){beep();toast(`طلب جديد ${newOnes[0].id}`)}if(!(sheetKind==='settings'))renderBoard()}
 if(sheetKind==='track'||sheetKind==='mine')renderSheet();
});

/* glass interactions: spotlight, tilt, magnetic */
(function(){
 let cur=null,mag=null;const g=G();
 const reset=el=>{if(g&&el)g.to(el,{rotationX:0,rotationY:0,duration:.8,ease:'power3.out',overwrite:'auto'});if(el)el.classList.remove('touch')};
 const unmag=el=>{if(g&&el)g.to(el,{x:0,y:0,duration:.6,ease:'elastic.out(1,.5)',overwrite:'auto'})};
 document.addEventListener('pointermove',e=>{
  const c=e.target.closest&&e.target.closest('.card,.brand-tile');
  if(c!==cur){reset(cur);cur=c}
  if(c){const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;c.style.setProperty('--mx',x*100+'%');c.style.setProperty('--my',y*100+'%');
   if(g&&e.pointerType==='mouse')g.to(c,{rotationX:(.5-y)*6,rotationY:(x-.5)*6,transformPerspective:900,duration:.8,ease:'power3.out',overwrite:'auto'})}
  const m=e.pointerType==='mouse'&&e.target.closest&&e.target.closest('.add,.cartbar button');
  if(m!==mag){unmag(mag);mag=m||null}
  if(m&&g){const r=m.getBoundingClientRect(),k=m.matches('.add')?.4:.08;g.to(m,{x:(e.clientX-r.left-r.width/2)*k,y:(e.clientY-r.top-r.height/2)*k*1.5,duration:.5,ease:'power3.out',overwrite:'auto'})}
 },{passive:true});
 document.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;const c=e.target.closest&&e.target.closest('.card,.brand-tile');if(c){const r=c.getBoundingClientRect();c.style.setProperty('--mx',(e.clientX-r.left)/r.width*100+'%');c.style.setProperty('--my',(e.clientY-r.top)/r.height*100+'%');c.classList.add('touch');setTimeout(()=>c.classList.remove('touch'),700)}},{passive:true});
 document.addEventListener('pointerleave',()=>{reset(cur);cur=null;unmag(mag);mag=null});
})();

route();
})();
</script>
